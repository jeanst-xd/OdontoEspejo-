<script type="module">
  // ====== CONFIGURACIÓN DE FIREBASE ======
  // Reemplaza estos valores por los de TU proyecto de Firebase (ver instrucciones).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBerEQWFs3Ol2oic7krbIRjGGJ5Z55wkpg",
    authDomain: "agenda-odontoespejo.firebaseapp.com",
    projectId: "agenda-odontoespejo",
    storageBucket: "agenda-odontoespejo.firebasestorage.app",
    messagingSenderId: "379069318647",
    appId: "1:379069318647:web:167f9dc72c27cc356e5af2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Exponemos funciones simples en window para que el resto del código las use
  window.dbGet = async (key) => {
    const snap = await getDoc(doc(db, "citas", key));
    return snap.exists() ? snap.data().value : null;
  };
  window.dbSet = async (key, value) => {
    await setDoc(doc(db, "citas", key), { value });
  };
  window.firebaseReady = true;
</script>

<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22OdontoEspejo%22,%22short_name%22:%22OdontoEspejo%22,%22display%22:%22standalone%22,%22theme_color%22:%22%236858C7%22,%22background_color%22:%22%23F4F5FB%22}">
<style>
  :root{
    --bg:#F4F5FB;
    --card:#FFFFFF;
    --ink:#2B2A45;
    --sub:#726F9C;
    --line:#E1E0F2;
    --c1:#59BEC9;
    --c1-bg:#E4F6F8;
    --c1-bd:#A9E1E6;
    --c2:#6858C7;
    --c2-bg:#EEECFB;
    --c2-bd:#C3BCEC;
    --danger:#993C1D;
    --danger-bg:#FAECE7;
    --empty:#F1F0F9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  header .brand{display:flex;align-items:center;}
  header .brand img{height:34px;width:auto;display:block;}
  .status{font-size:12px;color:var(--sub);}
  .datebar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:8px 6px;margin-bottom:12px;
  }
  .datebar button{
    border:none;background:transparent;font-size:20px;color:var(--ink);
    width:40px;height:40px;border-radius:10px;cursor:pointer;
  }
  .datebar button:active{background:var(--empty);}
  .datebar .center{text-align:center;flex:1;}
  .datebar .dow{font-size:12px;color:var(--sub);text-transform:capitalize;}
  .datebar .dnum{font-size:16px;font-weight:700;text-transform:capitalize;}
  .todaybtn{
    display:block;width:100%;text-align:center;font-size:12px;color:var(--c1);
    background:var(--c1-bg);border:1px solid var(--c1-bd);border-radius:10px;
    padding:6px;margin-bottom:14px;cursor:pointer;
  }
  .legend{display:flex;gap:14px;margin:2px 0 14px;font-size:12px;color:var(--sub);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.c1{background:var(--c1);}
  .dot.c2{background:var(--c2);}
  .slot{
    display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;
    margin-bottom:8px;align-items:stretch;
  }
  .time{
    font-size:12px;color:var(--sub);display:flex;align-items:center;
    justify-content:flex-end;padding-right:2px;font-variant-numeric:tabular-nums;
  }
  .cell{
    border-radius:12px;padding:9px 10px;min-height:52px;cursor:pointer;
    border:1px solid var(--line);background:var(--empty);
    display:flex;flex-direction:column;justify-content:center;gap:2px;
    transition:transform .08s;
  }
  .cell:active{transform:scale(0.97);}
  .cell.filled.c1{background:var(--c1-bg);border-color:var(--c1-bd);}
  .cell.filled.c2{background:var(--c2-bg);border-color:var(--c2-bd);}
  .cell .name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;}
  .cell.filled.c1 .name{color:#083B2F;}
  .cell.filled.c2 .name{color:#26215C;}
  .cell .tipo{font-size:11px;color:var(--sub);}
  .cell .plus{font-size:18px;color:#9CA6A3;text-align:center;}
  .gap-label{
    font-size:11px;color:var(--sub);text-align:center;margin:14px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .gap-label::before,.gap-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .colheads{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;margin-bottom:8px;}
  .colheads .h{font-size:11px;font-weight:700;color:var(--sub);text-align:center;text-transform:uppercase;letter-spacing:.03em;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,28,0.42);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet h2{font-size:16px;margin:0 0 2px;}
  .sheet .subhead{font-size:12px;color:var(--sub);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .field input[type=text]{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    font-size:15px;background:#FBFCFC;color:var(--ink);
  }
  .field input[type=text]:focus{outline:2px solid var(--c1-bd);border-color:var(--c1);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:#FBFCFC;font-size:13px;cursor:pointer;color:var(--sub);
  }
  .chip.sel{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:600;}
  .consult-row{display:flex;gap:8px;}
  .consult-row .chip{flex:1;text-align:center;}
  .consult-row .chip.sel.c2{background:var(--c2);border-color:var(--c2);}
  .err{font-size:12px;color:var(--danger);margin-top:6px;display:none;}
  .err.show{display:block;}
  .actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--c1);border-color:var(--c1);color:#fff;}
  .btn.danger{background:var(--danger-bg);border-color:#F0997B;color:var(--danger);}
  .btn:active{transform:scale(0.98);}
  .closebar{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .empty-note{font-size:12px;color:var(--sub);text-align:center;margin:18px 0 4px;}
</style>
</head>

    <span class="status" id="status">cargando…</span>
  </header>

  <div class="datebar">
    <button id="prevDay" aria-label="Día anterior">‹</button>
    <div class="center">
      <div class="dow" id="dow"></div>
      <div class="dnum" id="dnum"></div>
    </div>
    <button id="nextDay" aria-label="Día siguiente">›</button>
  </div>
  <div class="todaybtn" id="todayBtn">ir a hoy</div>

  <div class="legend">
    <span><i class="dot c1"></i>Consultorio 1</span>
    <span><i class="dot c2"></i>Consultorio 2</span>
  </div>

  <div class="colheads">
    <div></div>
    <div class="h">Consultorio 1</div>
    <div class="h">Consultorio 2</div>
  </div>

  <div id="grid"></div>
  <div class="empty-note">Toca un espacio vacío para agendar, o una cita para editarla o borrarla.</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="closebar"></div>
    <h2 id="sheetTitle">Nueva cita</h2>
    <div class="subhead" id="sheetSub"></div>

    <div class="field">
      <label for="pacienteInput">Paciente (nombre o apellido)</label>
      <input type="text" id="pacienteInput" placeholder="Ej. García" maxlength="40">
    </div>

    <div class="field">
      <label>Consultorio</label>
      <div class="consult-row">
        <div class="chip" data-consult="1">Consultorio 1</div>
        <div class="chip" data-consult="2">Consultorio 2</div>
      </div>
    </div>

    <div class="field">
      <label>Tratamiento</label>
      <div class="chip-row" id="tipoRow">
        <div class="chip" data-tipo="Consulta">Consulta</div>
        <div class="chip" data-tipo="Limpieza Dental">Limpieza Dental</div>
        <div class="chip" data-tipo="Ortodoncia">Ortodoncia</div>
        <div class="chip" data-tipo="Curación">Curación</div>
        <div class="chip" data-tipo="Extracción">Extracción</div>
        <div class="chip" data-tipo="Otros">Otros</div>
      </div>
    </div>

    <div class="field" id="otroField" style="display:none;">
      <label for="otroInput">Especificar</label>
      <input type="text" id="otroInput" placeholder="Ej. limpieza profunda" maxlength="60">
    </div>

    <div class="err" id="errMsg"></div>

    <div class="actions">
      <button class="btn danger" id="deleteBtn" style="display:none;">Borrar</button>
      <button class="btn" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script>
const DAY_BLOCKS = [ [9*60, 13*60], [15*60, 19*60] ]; // minutos desde medianoche
const STEP = 30;

function pad(n){ return n.toString().padStart(2,'0'); }
function minutesToLabel(m){
  let h = Math.floor(m/60), mi = m%60;
  const ampm = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12; if (h12===0) h12 = 12;
  return h12 + (mi ? ':'+pad(mi) : ':00') + ' ' + ampm;
}
function dateKey(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function buildSlots(){
  const slots = [];
  DAY_BLOCKS.forEach(([start,end], bi) => {
    for (let m = start; m < end; m += STEP) slots.push(m);
  });
  return slots;
}
const SLOTS = buildSlots();

let currentDate = new Date();
currentDate.setHours(0,0,0,0);
let dayData = {}; // { "540-1": {paciente, tipo, otro} }  key = minute-consultorio
let editingKey = null;
let selectedConsult = null;
let selectedTipo = null;

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const overlay = document.getElementById('overlay');

function setStatus(t){ statusEl.textContent = t; }

async function loadDay(){
  setStatus('cargando…');
  gridEl.innerHTML = '';
  const key = 'citas:' + dateKey(currentDate);
  try {
    const value = await window.dbGet(key);
    dayData = value ? JSON.parse(value) : {};
  } catch (e) {
    dayData = {};
  }
  renderHeader();
  renderGrid();
  setStatus('actualizado');
}

async function saveDay(){
  const key = 'citas:' + dateKey(currentDate);
  try {
    await window.dbSet(key, JSON.stringify(dayData));
    setStatus('guardado');
  } catch (e) {
    setStatus('error al guardar');
  }
}

function renderHeader(){
  const dow = currentDate.toLocaleDateString('es-ES', { weekday:'long' });
  const dnum = currentDate.toLocaleDateString('es-ES', { day:'numeric', month:'long' });
  document.getElementById('dow').textContent = dow;
  document.getElementById('dnum').textContent = dnum;
}

function renderGrid(){
  gridEl.innerHTML = '';
  let lastBlock = null;
  SLOTS.forEach(m => {
    const blockIdx = DAY_BLOCKS.findIndex(([s,e]) => m >= s && m < e);
    if (lastBlock !== null && blockIdx !== lastBlock) {
      const lbl = document.createElement('div');
      lbl.className = 'gap-label';
      lbl.textContent = 'cierra al mediodía';
      gridEl.appendChild(lbl);
    }
    lastBlock = blockIdx;

    const row = document.createElement('div');
    row.className = 'slot';

    const timeEl = document.createElement('div');
    timeEl.className = 'time';
    timeEl.textContent = minutesToLabel(m);
    row.appendChild(timeEl);

    [1,2].forEach(consult => {
      const k = m + '-' + consult;
      const data = dayData[k];
      const cell = document.createElement('div');
      cell.className = 'cell' + (data ? ' filled c'+consult : '');
      if (data) {
        cell.innerHTML = `<div class="name">${escapeHtml(data.paciente)}</div><div class="tipo">${escapeHtml(data.tipo === 'Otros' && data.otro ? data.otro : data.tipo)}</div>`;
      } else {
        cell.innerHTML = `<div class="plus">+</div>`;
      }
      cell.addEventListener('click', () => openSheet(m, consult, data));
      row.appendChild(cell);
    });

    gridEl.appendChild(row);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ---- sheet / modal ----
const sheetTitle = document.getElementById('sheetTitle');
const sheetSub = document.getElementById('sheetSub');
const pacienteInput = document.getElementById('pacienteInput');
const otroField = document.getElementById('otroField');
const otroInput = document.getElementById('otroInput');
const errMsg = document.getElementById('errMsg');
const deleteBtn = document.getElementById('deleteBtn');

function openSheet(minute, consult, data){
  editingKey = minute + '-' + consult;
  selectedConsult = consult;
  selectedTipo = data ? data.tipo : null;
  errMsg.classList.remove('show');

  sheetTitle.textContent = data ? 'Editar cita' : 'Nueva cita';
  sheetSub.textContent = minutesToLabel(minute) + ' · consultorio ' + consult;

  pacienteInput.value = data ? data.paciente : '';
  otroInput.value = data && data.otro ? data.otro : '';
  otroField.style.display = (selectedTipo === 'Otros') ? 'block' : 'none';

  document.querySelectorAll('[data-consult]').forEach(el => {
    el.classList.toggle('sel', Number(el.dataset.consult) === consult);
  });
  document.querySelectorAll('[data-tipo]').forEach(el => {
    el.classList.toggle('sel', el.dataset.tipo === selectedTipo);
  });

  deleteBtn.style.display = data ? 'block' : 'none';
  overlay.classList.add('open');
  setTimeout(() => pacienteInput.focus(), 50);
}

function closeSheet(){
  overlay.classList.remove('open');
  editingKey = null;
}

document.querySelectorAll('[data-consult]').forEach(el => {
  el.addEventListener('click', () => {
    selectedConsult = Number(el.dataset.consult);
    document.querySelectorAll('[data-consult]').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
  });
});
document.querySelectorAll('[data-tipo]').forEach(el => {
  el.addEventListener('click', () => {
    selectedTipo = el.dataset.tipo;
    document.querySelectorAll('[data-tipo]').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    otroField.style.display = (selectedTipo === 'Otros') ? 'block' : 'none';
    if (selectedTipo === 'Otros') setTimeout(() => otroInput.focus(), 50);
  });
});

document.getElementById('cancelBtn').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  const paciente = pacienteInput.value.trim();
  errMsg.classList.remove('show');

  if (!paciente) {
    errMsg.textContent = 'Escribe el nombre o apellido del paciente.';
    errMsg.classList.add('show');
    pacienteInput.focus();
    return;
  }
  if (!selectedTipo) {
    errMsg.textContent = 'Elige un tratamiento.';
    errMsg.classList.add('show');
    return;
  }
  if (selectedTipo === 'Otros' && !otroInput.value.trim()) {
    errMsg.textContent = 'Especifica qué se va a realizar.';
    errMsg.classList.add('show');
    otroInput.focus();
    return;
  }

  const [minuteStr, oldConsultStr] = editingKey.split('-');
  const minute = Number(minuteStr);
  const newKey = minute + '-' + selectedConsult;

  // si cambiaron de consultorio y el nuevo ya está ocupado por otro paciente
  if (newKey !== editingKey && dayData[newKey]) {
    errMsg.textContent = 'Ese consultorio ya tiene una cita a esta hora.';
    errMsg.classList.add('show');
    return;
  }

  if (newKey !== editingKey) delete dayData[editingKey];

  dayData[newKey] = {
    paciente,
    tipo: selectedTipo,
    otro: selectedTipo === 'Otros' ? otroInput.value.trim() : ''
  };

  await saveDay();
  renderGrid();
  closeSheet();
});

deleteBtn.addEventListener('click', async () => {
  if (editingKey && dayData[editingKey]) {
    delete dayData[editingKey];
    await saveDay();
    renderGrid();
  }
  closeSheet();
});

// ---- day navigation ----
document.getElementById('prevDay').addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() - 1);
  loadDay();
});
document.getElementById('nextDay').addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() + 1);
  loadDay();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  currentDate = new Date();
  currentDate.setHours(0,0,0,0);
  loadDay();
});

function waitForFirebase(cb){
  if (window.firebaseReady) return cb();
  setTimeout(() => waitForFirebase(cb), 50);
}
waitForFirebase(() => {
  loadDay();
  setInterval(loadDay, 20000); // refresca cada 20s para reflejar cambios de otros celulares
});
</script>
